<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Spoiler-Free Scores</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #14161a; --muted: #6b7280; --line: #e5e7eb;
    --w: #15803d; --w-bg: #dcfce7; --l: #b91c1c; --l-bg: #fee2e2;
    --otl: #b45309; --otl-bg: #fef3c7; --t: #475569; --t-bg: #e2e8f0; --live: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --card: #181b20; --text: #f1f2f4; --muted: #9aa1ac; --line: #2a2f37;
      --w: #4ade80; --w-bg: #14391f; --l: #f87171; --l-bg: #431818;
      --otl: #fbbf24; --otl-bg: #3d2d0a; --t: #cbd5e1; --t-bg: #2b323c; --live: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.25rem; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }
  #refresh {
    flex: none; font: inherit; font-size: .85rem; font-weight: 600; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; min-height: 40px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #refresh:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  #refresh:disabled { opacity: .6; cursor: default; }
  .team { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .head {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 14px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .head:focus-visible { outline: 2px solid var(--live); outline-offset: -2px; }
  .head img { width: 44px; height: 44px; object-fit: contain; flex: none; }
  .name { font-weight: 650; font-size: 1.05rem; }
  .hint { color: var(--muted); font-size: .8rem; }
  .chev { margin-left: auto; color: var(--muted); transition: transform .2s; flex: none; }
  .team.open .chev { transform: rotate(180deg); }
  .body { display: none; padding: 0 16px 14px; border-top: 1px solid var(--line); }
  .team.open .body { display: block; }
  h2 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .game { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .game + .game { border-top: 1px solid var(--line); }
  .game img { width: 28px; height: 28px; object-fit: contain; flex: none; }
  .opp { flex: 1; min-width: 0; }
  .opp b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opp span { color: var(--muted); font-size: .8rem; }
  .badge { min-width: 46px; text-align: center; font-weight: 750; border-radius: 8px; padding: 5px 8px; font-size: .9rem; flex: none; }
  .W { color: var(--w); background: var(--w-bg); } .L { color: var(--l); background: var(--l-bg); }
  .OTL { color: var(--otl); background: var(--otl-bg); } .T { color: var(--t); background: var(--t-bg); }
  .live { color: var(--live); font-weight: 650; font-size: .8rem; flex: none; }
  .none { color: var(--muted); font-size: .9rem; padding: 6px 0; }
  .err { color: var(--l); }
  footer { color: var(--muted); font-size: .75rem; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Spoiler-Free Scores</h1>
    <button id="refresh" type="button">↻ Refresh</button>
  </div>
  <p class="sub">Tap a team to reveal results. No scores, ever.</p>
  <div id="teams"><p class="none">Loading…</p></div>
  <footer id="updated"></footer>
</main>
<script>
(function () {
  var root = document.getElementById("teams");
  var fmt = { weekday: "short", month: "short", day: "numeric" };
  var fmtTime = { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function logo(src) {
    var i = document.createElement("img");
    i.alt = ""; i.loading = "lazy"; i.referrerPolicy = "no-referrer";
    if (src) i.src = src;
    return i;
  }
  function game(g, upcoming) {
    var row = el("div", "game");
    row.appendChild(logo(g.opponentLogo));
    var opp = el("div", "opp");
    opp.appendChild(el("b", null, (g.home ? "vs " : "at ") + g.opponent));
    var d = new Date(g.date);
    opp.appendChild(el("span", null, d.toLocaleString(undefined, upcoming ? fmtTime : fmt)));
    row.appendChild(opp);
    if (g.state === "live") row.appendChild(el("span", "live", "● In progress"));
    else if (g.result) row.appendChild(el("span", "badge " + g.result, g.result));
    return row;
  }
  function section(title, games, upcoming, emptyMsg) {
    var wrap = document.createDocumentFragment();
    wrap.appendChild(el("h2", null, title));
    if (!games.length) wrap.appendChild(el("div", "none", emptyMsg));
    games.forEach(function (g) { wrap.appendChild(game(g, upcoming)); });
    return wrap;
  }
  function card(t, idx) {
    var c = el("section", "team");
    var h = el("button", "head");
    h.type = "button";
    h.setAttribute("aria-expanded", "false");
    h.setAttribute("aria-controls", "body" + idx);
    h.appendChild(logo(t.logo));
    var txt = el("div");
    txt.appendChild(el("div", "name", t.name));
    txt.appendChild(el("div", "hint", t.league + " · tap to reveal"));
    h.appendChild(txt);
    h.appendChild(el("span", "chev", "▾"));
    var b = el("div", "body"); b.id = "body" + idx;
    b.appendChild(section("Last 3 games", t.recent, false, "No games played yet."));
    b.appendChild(section("Next 3 games", t.upcoming, true, "No games scheduled."));
    function setOpen(open) {
      c.classList.toggle("open", open);
      h.setAttribute("aria-expanded", open);
      txt.lastChild.textContent = t.league + (open ? "" : " · tap to reveal");
      if (open) openTeams[t.name] = true; else delete openTeams[t.name];
    }
    h.addEventListener("click", function () { setOpen(!c.classList.contains("open")); });
    if (openTeams[t.name]) setOpen(true);  // keep a card open across refreshes
    c.appendChild(h); c.appendChild(b);
    return c;
  }

  var btn = document.getElementById("refresh");
  var footer = document.getElementById("updated");
  var openTeams = {};
  var loaded = false;

  function load() {
    btn.disabled = true; btn.textContent = "Refreshing…";
    return fetch("results.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        root.textContent = "";
        data.teams.forEach(function (t, i) { root.appendChild(card(t, i)); });
        loaded = true;
        footer.textContent = data.updated
          ? "Results last changed " + new Date(data.updated).toLocaleString(undefined, fmtTime)
          : "";
      })
      .catch(function () {
        if (loaded) { footer.textContent = "Couldn't refresh — showing the previous results."; return; }
        root.textContent = "";
        root.appendChild(el("p", "none err", "Couldn't load results. Try again in a moment."));
      })
      .then(function () { btn.disabled = false; btn.textContent = "↻ Refresh"; });
  }
  btn.addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
