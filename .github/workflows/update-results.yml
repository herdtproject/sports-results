name: Update results

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch results (scores are discarded)
        run: python scripts/update_results.py
      - name: Fetch standings
        run: python scripts/update_standings.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain results.json standings.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results.json standings.json
            git commit -m "Update results"
            git push
          fi
